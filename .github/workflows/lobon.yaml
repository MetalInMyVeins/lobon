name: lobon

on:
  push:
    branches: [ main ]
    paths:
      - 'include/**'
      - 'src/**'
      - 'Makefile'
      - '.github/workflows/lobon.yaml'
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential lld nasm

      - name: Debug Build
        run: make debx64 LINKER=lld

      - name: Release Build
        run: make relx64 LINKER=bfd
