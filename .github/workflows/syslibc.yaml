name: syslibc

on:
  push:
    branches: [ main ]
    paths:
      - 'include/**'
      - 'mk/**'
      - 'src/**'
      - 'Makefile'
      - '.github/workflows/syslibc.yaml'
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang lld nasm

      - name: Build with GCC
        run: make lib CC=gcc CXX=g++ LD=ld

      - name: Build with Clang
        run: make lib CC=clang CXX=clang++ LD=ld.lld
