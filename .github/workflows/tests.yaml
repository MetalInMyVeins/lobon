name: tests

on:
  push:
    branches: [ main ]
    paths:
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - 'Makefile'
      - '.github/workflows/lobon.yaml'
      - '.github/workflows/tests.yaml'
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang lld nasm git
      
      - name: Pull Submodules
        run: git submodule update --init

      - name: Build Test Framework
        run: make sohomot

      - name: Clang Test Build
        run: make testx64 CC=clang LINKER=lld

      - name: Run Clang Tests
        run: build/tests/x86_64/test_all

      - name: Clean Build
        run: make clean

      - name: GCC Test Build
        run: make testx64 CC=gcc LINKER=bfd

      - name: Run GCC Tests
        run: build/tests/x86_64/test_all
